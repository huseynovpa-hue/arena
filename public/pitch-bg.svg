<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200">
  <rect width="800" height="1200" fill="none"/>
  <!-- pitch outline -->
  <rect x="80" y="60" width="640" height="1080" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.04"/>
  <!-- halfway line -->
  <line x1="80" y1="600" x2="720" y2="600" stroke="#22c55e" stroke-width="2" opacity="0.04"/>
  <!-- center circle -->
  <circle cx="400" cy="600" r="120" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.04"/>
  <!-- center dot -->
  <circle cx="400" cy="600" r="6" fill="#22c55e" opacity="0.04"/>
  <!-- top penalty box -->
  <rect x="220" y="60" width="360" height="180" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.04"/>
  <!-- top goal box -->
  <rect x="300" y="60" width="200" height="72" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.04"/>
  <!-- top penalty arc -->
  <path d="M 300 240 Q 400 300 500 240" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.04"/>
  <!-- top penalty dot -->
  <circle cx="400" cy="204" r="5" fill="#22c55e" opacity="0.04"/>
  <!-- bottom penalty box -->
  <rect x="220" y="960" width="360" height="180" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.04"/>
  <!-- bottom goal box -->
  <rect x="300" y="1068" width="200" height="72" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.04"/>
  <!-- bottom penalty arc -->
  <path d="M 300 960 Q 400 900 500 960" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.04"/>
  <!-- bottom penalty dot -->
  <circle cx="400" cy="996" r="5" fill="#22c55e" opacity="0.04"/>
  <!-- corner arcs -->
  <path d="M 92 60 A 12 12 0 0 0 80 72" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.04"/>
  <path d="M 708 60 A 12 12 0 0 1 720 72" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.04"/>
  <path d="M 80 1128 A 12 12 0 0 0 92 1140" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.04"/>
  <path d="M 720 1128 A 12 12 0 0 1 708 1140" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.04"/>
</svg>
